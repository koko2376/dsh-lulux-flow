name: Feature request
description: Suggest an idea or a new CLI adapter.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gateway / CLI support
        - Workflow canvas
        - Workflow engine / nodes / triggers
        - Security
        - Docs / i18n
        - Other
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
